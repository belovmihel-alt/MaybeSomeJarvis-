# Конфигурация системы голосового управления для Orange Pi Zero 2W

# Настройки распознавания речи
speech:
  # Путь к модели Vosk (скачать с https://alphacephei.com/vosk/models)
  # Рекомендуется: vosk-model-small-ru-0.22 (45 МБ) для русского языка
  model_path: "model"

  # Частота дискретизации (16000 Hz оптимальна для Vosk)
  sample_rate: 16000

  # Слово активации (произносится перед командой)
  activation_word: "джарвис"

  # Индекс устройства ввода (None = по умолчанию)
  # Используйте python main.py -m для просмотра списка устройств
  device_index: null

# Настройки локальной LLM (Ollama)
llm:
  # URL Ollama API (должен быть запущен локально)
  ollama_url: "http://localhost:11434"

  # Модель для использования (рекомендуется llama3.2:3b для 4GB RAM)
  # Другие варианты: llama3.2:1b (еще легче), mistral:7b (тяжелее)
  model: "llama3.2:3b"

# Настройки сетевого соединения с основным ПК
network:
  # IP-адрес основного ПК в локальной сети
  server_host: "192.168.1.100"

  # Порт сервера
  server_port: 5000

  # API ключ для аутентификации (опционально)
  # Должен совпадать с ключом на сервере
  api_key: null
  # api_key: "your-secret-key-here"
