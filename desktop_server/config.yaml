# Конфигурация сервера выполнения Python скриптов

# Настройки сервера
server:
  # Адрес для прослушивания (0.0.0.0 = все интерфейсы)
  host: "0.0.0.0"

  # Порт сервера
  port: 5000

  # API ключ для аутентификации (должен совпадать с клиентом)
  # ВАЖНО: Установите свой уникальный ключ для безопасности!
  api_key: null
  # api_key: "your-secret-key-here"

# Настройки безопасности
security:
  # Разрешенные модули Python (не используется в текущей версии, для будущего расширения)
  allowed_modules:
    - os
    - sys
    - datetime
    - time
    - webbrowser
    - random
    - json
    - math
    - re

  # Максимальное время выполнения скрипта (секунды)
  timeout: 30

  # Максимальный размер вывода (символы)
  max_output_size: 10000
